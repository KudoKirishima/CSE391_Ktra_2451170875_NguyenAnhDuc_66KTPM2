<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task List</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css" />
</head>
<body class="bg-white">
  <div class="container mt-4 mb-5">
    <!-- Khối danh sách task -->
    <div class="border border-primary rounded-3 bg-light p-3 mb-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 fw-bold">Task List</h1>
        <a href="#addTaskBox" class="btn btn-primary">+ Add Task</a>
      </div>

      <div id="messageBox" class="mb-3"></div>

      <div id="taskList"></div>
    </div>

    <!-- Khối thêm task -->
    <div id="addTaskBox" class="border border-primary rounded-3 p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Add Task</h3>
        <span class="fw-bold">X</span>
      </div>

      <form id="taskForm">
        <div class="mb-3">
          <label for="taskName" class="form-label">Task</label>
          <input
            type="text"
            class="form-control"
            id="taskName"
            placeholder="Type your task here..."
          />
          <div id="taskNameError" class="text-danger mt-1"></div>
        </div>

        <div class="mb-4">
          <label for="priority" class="form-label">Priority</label>
          <div>
            <select class="form-select" id="priority">
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-secondary">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
